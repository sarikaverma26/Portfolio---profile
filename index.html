<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my profile page</title>
</head>

<body>
    <main>
        <h1>Registration Form</h1>
        <form>
            <label for="name">Name:</label>
            <input type="text" name="input-name" id="name" min="4" max="100">
            <br>
            <br>

            </label for="email">Email:</label>
            <input type="email" name="input-email" id="email">
            <br>
            <br>

            </label for="contact No ">Contact No:</label>
            <input type="number" name="input-contact" id="contact">
            <br>
            <br>

            </label for="address">Address:</label>
            <input type="text" name="input-address" id="address">

            <br>
            <br>

            <label for="dob">Date of Birth:</label>
            <input type="date" name="input-dob" id="dob">

            <br>
            <br>

            <label for="gender">Gender:</label>
            <label for="male">Male</label>
            <input type="radio" name="gender">

            <label for="female">Female</label>
            <input type="radio" name="gender">
            <br>
            <br>

            <label for="feedback">Feedback:</label>
            <textarea name="feedback" id="" cols="15" row="5"></textarea>

            <br>
            <br>

            <button>submit</button>
            <button>reset</button>

            <br>
            <br>

            <input type="checkbox" id="terms">
            <label for="terms">terms & conditions :</label>


        </form>
</body>

</html>
